 <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aset Gambar Saya</title>
    <!-- Tailwind CSS untuk Desain -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cloudinary Upload Widget -->
    <script src="https://widget.cloudinary.com/v2.0/global/all.js" type="text/javascript"></script>
    <!-- SweetAlert untuk Pop-up Cantik -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans pb-10">

    <!-- Header (Navigasi) -->
    <header class="bg-white shadow-sm p-4 sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-xl font-bold text-indigo-600">My CDN</h1>
        <button id="upload_widget" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-md hover:bg-indigo-700 active:scale-95 transition-all">
            + Upload
        </button>
    </header>

    <!-- Galeri -->
    <main class="p-4">
        <div id="loading" class="text-center text-gray-500 my-10 hidden">Memuat gambar...</div>
        <!-- Grid 2 kolom di HP, 4 kolom di layar lebar -->
        <div id="gallery" class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <!-- Gambar akan muncul otomatis di sini -->
        </div>
    </main>

    <!-- Logika Aplikasi (Javascript) -->
    <script type="module">
        // Import Firebase v10
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        // ==========================================
        // TUGAS 1: GANTI KONFIGURASI FIREBASE DI BAWAH INI
        // (Salin dari Firebase Console Langkah 2)
        // ==========================================
        const firebaseConfig = {
  apiKey: "AIzaSyCjjhzACEAURiDyo6AJlkmU-rv55qDsggM",
  authDomain: "aset-gambar.firebaseapp.com",
  projectId: "aset-gambar",
  storageBucket: "aset-gambar.firebasestorage.app",
  messagingSenderId: "354919273298",
  appId: "1:354919273298:web:bcb880580a10e43990a08b"
};

        // ==========================================
        // TUGAS 2: GANTI KONFIGURASI CLOUDINARY DI BAWAH INI
        // (Salin dari Dashboard Cloudinary Langkah 1)
        // ==========================================
        const CLOUD_NAME = "bzkdh6h1";
        const UPLOAD_PRESET = "Hamdan-aset";


        // --- ANDA TIDAK PERLU MENGUBAH KODE DI BAWAH INI ---

        // Menghubungkan ke Firebase
        let app, db;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
        } catch(e) {
            console.error("Menunggu Anda memasukkan kunci Firebase...");
        }

        const gallery = document.getElementById('gallery');
        const loading = document.getElementById('loading');

        // Fungsi Memuat Gambar dari Database
        async function loadImages() {
            if(!db) return;
            loading.classList.remove('hidden');
            gallery.innerHTML = ''; // Kosongkan galeri sebelum dimuat ulang
            try {
                // Tarik data, urutkan dari yang terbaru
                const q = query(collection(db, "images"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    renderCard(data.url, data.tag);
                });
            } catch (e) {
                console.error("Gagal memuat dari Firebase:", e);
            }
            loading.classList.add('hidden');
        }

        // Fungsi Menampilkan Kartu Gambar
        function renderCard(url, tag) {
            const card = document.createElement('div');
            card.className = "bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100 flex flex-col";
            card.innerHTML = `
                <div class="h-32 bg-gray-200 overflow-hidden relative">
                    <img src="${url}" class="w-full h-full object-cover" alt="${tag}">
                </div>
                <div class="p-3 flex-1 flex flex-col justify-between space-y-2">
                    <p class="text-xs font-medium text-gray-500 truncate">${tag || 'Tanpa tag'}</p>
                    <button onclick="salinURL('${url}')"
                            class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-semibold py-1.5 rounded transition active:scale-95">
                        Copy Link
                    </button>
                </div>
            `;
            gallery.appendChild(card);
        }

        // Fungsi Salin URL agar bisa diakses HTML/tombol
        window.salinURL = function(url) {
            navigator.clipboard.writeText(url).then(() => {
                Swal.fire({
                    icon: 'success', 
                    title: 'Tersalin!', 
                    text: 'Link gambar siap ditempel di web Anda',
                    toast: true, 
                    position: 'top-end', 
                    timer: 2000, 
                    showConfirmButton: false
                });
            });
        }

        // Konfigurasi Cloudinary Widget
        var myWidget = cloudinary.createUploadWidget({
            cloudName: CLOUD_NAME,
            uploadPreset: UPLOAD_PRESET,
            sources: ['local', 'camera', 'url'], // Bisa dari galeri HP atau kamera
            multiple: false
        }, async (error, result) => {
            if (!error && result && result.event === "success") {
                const imgUrl = result.info.secure_url;
                
                // Minta nama tag ke user
                const { value: tag } = await Swal.fire({
                    title: 'Beri Nama/Tag Gambar',
                    input: 'text',
                    inputPlaceholder: 'contoh: icon-home, hero-banner...',
                    showCancelButton: false,
                    confirmButtonText: 'Simpan'
                });

                // Simpan data ke Firebase
                if(db) {
                    try {
                        await addDoc(collection(db, "images"), {
                            url: imgUrl,
                            tag: tag || 'Tanpa tag',
                            createdAt: serverTimestamp()
                        });
                        Swal.fire({
                            icon: 'success',
                            title: 'Berhasil!',
                            text: 'Gambar tersimpan di CDN.'
                        });
                        loadImages(); // Refresh galeri otomatis
                    } catch(e) {
                        Swal.fire('Error', 'Gagal menyimpan ke database Firebase. Pastikan Test Mode aktif.', 'error');
                        console.error(e);
                    }
                }
            }
        });

        // Event Tombol Upload
        document.getElementById("upload_widget").addEventListener("click", function(){
            myWidget.open();
        }, false);

        // Muat gambar saat aplikasi dibuka
        loadImages();
    </script>
</body>
</html>
